[theme]
primaryColor = "#245C53"
linkColor = "#2F8F83"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
baseFontSize = 15
baseFontWeight = 400
headingFontWeights = [700, 700, 600, 600, 600, 500]
linkUnderline = false
baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true

# Series colors for Altair/Vega-Lite charts across the whole app.
chartCategoricalColors = [
    "#245C53",
    "#C9861E",
    "#4B7BEC",
    "#8E5FD1",
    "#2F8F83",
    "#D1495B",
    "#5A6B57",
]
chartSequentialColors = [
    "#EAF3F1",
    "#CFE6E1",
    "#AED9D0",
    "#87C8BB",
    "#5FB6A6",
    "#3EA292",
    "#2F8F83",
    "#245C53",
    "#1A453E",
    "#122F2A",
]

