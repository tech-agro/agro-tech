[project]
name = "agro-tech"
version = "0.1.0"
description = "Base do projeto agro-tech"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: testes que dependem do PostgreSQL",
    "unit: testes unitarios sem dependencias externas",
]
